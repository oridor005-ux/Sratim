<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>איך עובד דוד שמש</title>
<link rel="stylesheet" href="../../factory/frame.css">
<style>
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lbl { font-size: 17px; font-weight: 600; fill: #1f2a44; }
</style>
<script src="../../factory/frame.js"></script>
</head>
<body>
<svg id="s" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop id="sky1" offset="0" stop-color="#8ec5fc"/>
      <stop id="sky2" offset="1" stop-color="#e0f0ff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f5a99"/>
      <stop offset="1" stop-color="#26355e"/>
    </linearGradient>
    <linearGradient id="tankFill" x1="0" y1="0" x2="0" y2="1">
      <stop id="tk1" offset="0" stop-color="#4dabf7"/>
      <stop id="tk2" offset="0.5" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#4dabf7"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f4fa"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e6cf"/>
      <stop offset="1" stop-color="#7fd1ae"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2a44" flood-opacity="0.16"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect x="0" y="0" width="540" height="960" fill="url(#sky)"/>
  <circle cx="470" cy="120" r="140" fill="#ffffff" opacity="0.18" filter="url(#blur12)"/>

  <g id="sunG">
    <circle cx="96" cy="200" r="120" fill="url(#sunGlow)"/>
    <g id="petals" fill="#ffd166" opacity="0.55"></g>
    <circle cx="96" cy="200" r="46" fill="url(#sunCore)"/>
  </g>
  <g id="rays" stroke="#ffd166" stroke-width="7" stroke-linecap="round" filter="url(#glow)"></g>

  <g id="clouds" fill="#ffffff" filter="url(#shadow)">
    <g id="cloud1"><rect x="-80" y="-22" width="160" height="50" rx="25"/><circle cx="-20" cy="-22" r="32"/><circle cx="28" cy="-14" r="26"/></g>
    <g id="cloud2" opacity="0.95"><rect x="-62" y="-16" width="124" height="40" rx="20"/><circle cx="-12" cy="-16" r="26"/><circle cx="24" cy="-8" r="20"/></g>
  </g>

  <path d="M0 830 C120 800 240 815 330 828 C420 840 480 822 540 812 L540 960 L0 960 Z" fill="url(#hill)"/>

  <g filter="url(#shadow)">
    <rect x="36" y="536" width="468" height="300" rx="30" fill="url(#house)"/>
  </g>
  <rect x="36" y="526" width="468" height="22" rx="11" fill="#ffb4a2"/>
  <rect x="292" y="586" width="190" height="186" rx="24" fill="#e8f1fb"/>
  <g fill="#dbe8f6"><rect x="304" y="598" width="40" height="40" rx="8"/><rect x="350" y="598" width="40" height="40" rx="8"/><rect x="304" y="644" width="40" height="40" rx="8"/></g>
  <path d="M362 738 h118 v6 c0 18 -14 30 -32 30 h-54 c-18 0 -32 -12 -32 -30 z" fill="#ffffff" stroke="#c9d6e6" stroke-width="3"/>
  <g id="faucet">
    <path d="M417 672 v-6 c0 -14 10 -22 24 -22 h10" fill="none" stroke="#9fb0c4" stroke-width="10" stroke-linecap="round"/>
    <g id="handle"><rect x="440" y="626" width="26" height="9" rx="4.5" fill="#ff6b6b"/></g>
  </g>
  <g id="stream"></g>
  <g transform="translate(86 760)">
    <rect x="-18" y="0" width="36" height="34" rx="10" fill="#ffb4a2"/>
    <path d="M0 0 C-4 -26 -24 -34 -34 -30 C-30 -16 -16 -6 0 0 Z" fill="#7fd1ae"/>
    <path d="M0 0 C6 -30 26 -38 36 -32 C32 -16 16 -6 0 0 Z" fill="#5fbf95"/>
  </g>

  <g stroke="#b8c4d4" stroke-width="7" stroke-linecap="round">
    <line x1="336" y1="404" x2="324" y2="528"/>
    <line x1="456" y1="404" x2="468" y2="528"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#ffffff" stroke-width="15" filter="url(#shadow)">
    <path d="M240 404 C240 382 268 368 312 368"/>
    <path d="M330 400 C330 480 300 552 240 552 C190 552 165 550 165 536"/>
    <path d="M560 496 C522 496 502 476 502 440 C502 404 494 392 480 392"/>
    <path d="M440 330 C440 292 520 292 520 340 L520 596 C520 628 486 628 450 628 C428 628 417 640 417 668"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <path id="cRiser" d="M240 404 C240 382 268 368 312 368" stroke="#ff8787" opacity="0.25"/>
    <path id="cReturn" d="M330 400 C330 480 300 552 240 552 C190 552 165 550 165 536" stroke="#74c0fc" opacity="0.25"/>
    <path id="cMains" d="M560 496 C522 496 502 476 502 440 C502 404 494 392 480 392" stroke="#74c0fc" opacity="0.3"/>
    <path id="cOut" d="M440 330 C440 292 520 292 520 340 L520 596 C520 628 486 628 450 628 C428 628 417 640 417 668" stroke="#ff8787" opacity="0.3"/>
  </g>
  <g id="dots" filter="url(#glow)"></g>

  <g id="collector" filter="url(#shadow)">
    <path d="M110 534 L226 534 C238 534 246 528 251 518 L298 418 C303 408 296 402 286 402 L172 402 C162 402 154 408 150 418 L102 518 C97 528 100 534 110 534 Z" fill="url(#panel)"/>
  </g>
  <g id="tubes" stroke-width="6" stroke-linecap="round"></g>
  <path d="M168 410 L196 410 L140 528 L118 528 Z" fill="#ffffff" opacity="0.12"/>

  <g id="tank">
    <rect id="insul" x="298" y="318" width="194" height="94" rx="47" fill="#ffd166" opacity="0" filter="url(#glow)"/>
    <g filter="url(#shadow)">
      <rect x="306" y="326" width="178" height="78" rx="39" fill="url(#tankFill)"/>
    </g>
    <rect x="306" y="326" width="178" height="78" rx="39" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="330" y="334" width="110" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
    <path id="element" d="M354 388 q9 -14 18 0 t18 0 t18 0 t18 0 t18 0" fill="none" stroke="#5c6b80" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="labels"></g>

  <g id="titleG">
    <text id="title" x="270" y="92" text-anchor="middle" font-size="40" font-weight="800" fill="#1f2a44">איך עובד דוד שמש?</text>
    <rect id="titleBar" x="210" y="110" width="120" height="7" rx="3.5" fill="#ffb347"/>
  </g>
</svg>

<script>
const NS = "http://www.w3.org/2000/svg";
const { clamp, lerp, ease, span, $ } = H;
const mk = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || $("s")).appendChild(e);
  return e;
};
const mix = (c1, c2, k) => {
  const a = c1.match(/\w\w/g).map((h) => parseInt(h, 16));
  const b = c2.match(/\w\w/g).map((h) => parseInt(h, 16));
  return "#" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k))).toString(16).padStart(2, "0")).join("");
};
const COLD = "4dabf7", HOT = "ff6b6b", WARM = "ffa94d";

const flows = {};
function makeFlow(name, color, n, r = 5) {
  const path = $(name), L = path.getTotalLength();
  const g = mk("g", {}, $("dots"));
  const dots = [];
  for (let i = 0; i < n; i++) dots.push(mk("circle", { r, fill: color }, g));
  flows[name] = { path, L, dots };
}
function drawFlow(name, offset, visible) {
  const f = flows[name], step = f.L / f.dots.length;
  f.dots.forEach((d, i) => {
    const at = (((offset + i * step) % f.L) + f.L) % f.L;
    const pt = f.path.getPointAtLength(at);
    d.setAttribute("cx", pt.x); d.setAttribute("cy", pt.y); d.setAttribute("opacity", visible);
  });
}

const labels = {};
function label(key, text, x, y, dot) {
  const g = mk("g", { opacity: 0 }, $("labels"));
  const r = mk("rect", { rx: 17, height: 34, y: y - 17, fill: "#ffffff", filter: "url(#shadow)" }, g);
  const c = mk("circle", { r: 5, cy: y, fill: dot }, g);
  const t = mk("text", { x, y: y + 6, "text-anchor": "middle", class: "lbl" }, g);
  t.textContent = text;
  labels[key] = { g, r, c, t, x, sized: false };
}
function sizeLabels() {
  for (const k in labels) {
    const L = labels[k];
    if (L.sized) continue;
    const w = L.t.getComputedTextLength() + 44;
    L.r.setAttribute("x", L.x - w / 2); L.r.setAttribute("width", w);
    L.c.setAttribute("cx", L.x + w / 2 - 16);
    L.t.setAttribute("x", L.x - 6);
    L.sized = true;
  }
}

const tubes = [], rays = [], drops = [], petals = [];

window.init = function () {
  for (let i = 0; i < 6; i++) {
    const k = (i + 0.5) / 6;
    tubes.push(mk("line", { x1: lerp(112, 238, k), y1: 522, x2: lerp(166, 290, k), y2: 414, stroke: "#" + COLD }, $("tubes")));
  }
  for (let i = 0; i < 12; i++) petals.push(mk("rect", { x: 92, y: 120, width: 8, height: 22, rx: 4 }, $("petals")));
  for (let i = 0; i < 4; i++) rays.push(mk("line", { opacity: 0 }, $("rays")));
  for (let i = 0; i < 7; i++) drops.push(mk("ellipse", { rx: 4, ry: 6, fill: "#74c0fc", opacity: 0 }, $("stream")));

  makeFlow("cRiser", "#ff6b6b", 5);
  makeFlow("cReturn", "#4dabf7", 9);
  makeFlow("cMains", "#4dabf7", 7);
  makeFlow("cOut", "#ff6b6b", 15);

  label("collector", "קולט שמש", 175, 596, "#3f5a99");
  label("tank", "דוד מים", 395, 286, "#4dabf7");
  label("hot", "חם למעלה", 395, 290, "#ff6b6b");
  label("cold", "קר למטה", 395, 440, "#4dabf7");
  label("mains", "מי עירייה", 450, 478, "#4dabf7");
  label("riser", "מים חמים עולים", 200, 340, "#ff6b6b");
  label("return", "מים קרים יורדים", 250, 592, "#4dabf7");
  label("element", "גוף חימום חשמלי", 395, 442, "#ffa94d");
  label("insul", "בידוד", 248, 300, "#ffd166");
};

const ORDER = ["intro", "sun", "thermo", "tank", "tap", "backup", "outro"];

window.drawScene = function (sc, p, t, info, local) {
  sizeLabels();
  const idx = ORDER.indexOf(sc.id);
  const is = (id) => sc.id === id;
  const fadeIn = (d = 0.8) => clamp(local / d);

  const titleOp = is("intro") ? ease(fadeIn(0.8)) : is("outro") ? ease(fadeIn()) : is("sun") ? clamp(1 - local / 0.6) : 0;
  $("titleG").setAttribute("opacity", titleOp);
  const ty = is("intro") ? lerp(20, 0, ease(fadeIn(1))) : 0;
  $("titleG").setAttribute("transform", `translate(0 ${ty})`);
  const bar = is("intro") ? ease(span(local, 0.4, 1.4)) : 1;
  $("titleBar").setAttribute("width", 120 * bar);
  $("titleBar").setAttribute("x", 270 - 60 * bar);

  const cloudy = is("backup") ? ease(fadeIn(1.6)) : is("outro") ? 1 - ease(fadeIn(1.2)) : 0;
  $("cloud1").setAttribute("transform", `translate(${lerp(-140, 104, cloudy)} 196)`);
  $("cloud2").setAttribute("transform", `translate(${lerp(-110, 168, cloudy)} 244)`);
  $("sky1").setAttribute("stop-color", mix("8ec5fc", "a3b1c6", cloudy));
  $("sky2").setAttribute("stop-color", mix("e0f0ff", "dfe5ee", cloudy));
  const pulse = 1 + 0.05 * Math.sin(t * 2.4);
  $("sunG").setAttribute("transform", `translate(96 200) scale(${pulse}) translate(-96 -200)`);
  petals.forEach((pt, i) => {
    const a = (i / petals.length) * 360 + t * 12;
    pt.setAttribute("transform", `rotate(${a} 96 200)`);
    pt.setAttribute("y", 200 - 74 - 4 * Math.sin(t * 3 + i));
  });

  const raysOn = (idx >= 1 ? (is("sun") ? fadeIn(1) : 1) : 0) * (1 - cloudy);
  rays.forEach((r, i) => {
    const k = (t * 0.8 + i / 4) % 1;
    const sx = 138, sy = 236, ex = lerp(160, 268, i / 3), ey = lerp(484, 432, i / 3);
    const a = clamp(k - 0.12), b = clamp(k + 0.12);
    r.setAttribute("x1", lerp(sx, ex, a)); r.setAttribute("y1", lerp(sy, ey, a));
    r.setAttribute("x2", lerp(sx, ex, b)); r.setAttribute("y2", lerp(sy, ey, b));
    r.setAttribute("opacity", raysOn * Math.sin(Math.PI * k));
  });

  const collHeat = idx === 0 ? 0 : is("sun") ? ease(span(local, 0.5, 4)) : is("backup") ? 1 - cloudy * 0.8 : 1;
  tubes.forEach((tb) => tb.setAttribute("stroke", mix(COLD, HOT, collHeat)));

  let heat = 0;
  if (is("sun")) heat = 0.1 * collHeat;
  else if (is("thermo")) heat = lerp(0.1, 0.85, ease(p));
  else if (idx >= 3) heat = 0.9;
  if (is("tap")) heat = 0.9 - 0.12 * ease(p);
  if (is("backup")) heat = lerp(0.78, 0.92, ease(span(local, 1.5, 6)));
  if (is("outro")) heat = 0.92;
  $("tk1").setAttribute("stop-color", mix(COLD, HOT, heat));
  $("tk2").setAttribute("offset", lerp(0.15, 0.62, heat));
  $("tk2").setAttribute("stop-color", mix(COLD, WARM, heat * 0.9));

  $("insul").setAttribute("opacity", is("tank") ? 0.5 * (0.65 + 0.35 * Math.sin(local * 3.5)) * fadeIn() : 0);

  const elem = is("backup") ? ease(span(local, 1.2, 3)) : 0;
  $("element").setAttribute("stroke", mix("5c6b80", "ff922b", elem));
  $("element").setAttribute("stroke-width", 4 + elem * 2);
  if (elem > 0.3) $("element").setAttribute("filter", "url(#glow)"); else $("element").removeAttribute("filter");

  let thermo = 0;
  if (is("sun")) thermo = 0.3 * ease(span(local, 2, 5));
  else if (is("thermo")) thermo = 1;
  else if (is("tank") || is("tap") || is("outro")) thermo = 0.5;
  else if (is("backup")) thermo = 0.5 * (1 - cloudy);
  const tv = thermo > 0 ? 1 : 0;
  $("cRiser").setAttribute("opacity", 0.25 + 0.35 * tv);
  $("cReturn").setAttribute("opacity", 0.25 + 0.35 * tv);
  const sp = 42 * (thermo > 0.6 ? 1 : 0.5);
  drawFlow("cRiser", t * sp, tv);
  drawFlow("cReturn", t * sp, tv);

  const tap = is("tap") ? ease(span(local, 0.6, 1.6)) : is("outro") ? 1 - fadeIn(0.8) : 0;
  $("handle").setAttribute("transform", `rotate(${-40 * tap} 440 630)`);
  const on = tap > 0.05 ? 1 : 0;
  drawFlow("cOut", t * 110, on);
  drawFlow("cMains", t * 80, on);
  $("cOut").setAttribute("opacity", 0.3 + 0.4 * tap);
  $("cMains").setAttribute("opacity", 0.3 + 0.4 * tap);
  drops.forEach((d, i) => {
    const k = (t * 2.2 + i / drops.length) % 1;
    d.setAttribute("cx", 417);
    d.setAttribute("cy", lerp(680, 742, k));
    d.setAttribute("opacity", tap > 0.1 ? 0.9 * Math.sin(Math.PI * k) + 0.1 : 0);
    d.setAttribute("fill", mix("74c0fc", "ff8787", 0.5));
  });

  const show = {
    collector: is("intro") ? span(local, 1.5, 2.3) : is("sun") ? 1 : 0,
    tank: is("intro") ? span(local, 2.3, 3.1) : 0,
    riser: is("thermo") ? span(local, 1, 1.8) : 0,
    return: is("thermo") ? span(local, 3, 3.8) : 0,
    hot: is("tank") ? span(local, 2, 2.6) : 0,
    cold: is("tank") ? span(local, 3, 3.6) : 0,
    insul: is("tank") ? span(local, 0.5, 1.2) : 0,
    mains: is("tap") ? span(local, 2, 2.8) : 0,
    element: is("backup") ? span(local, 1.5, 2.3) : 0,
  };
  for (const k in labels) {
    const v = ease(show[k] || 0);
    labels[k].g.setAttribute("opacity", v);
    labels[k].g.setAttribute("transform", `translate(0 ${(1 - v) * 10})`);
  }
};
</script>
</body>
</html>
