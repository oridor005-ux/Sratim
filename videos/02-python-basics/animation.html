<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../factory/frame.css">
<style>
  body { background: linear-gradient(170deg, #eef2ff 0%, #f6f1ff 55%, #fff4ec 100%); }
  .slide { position: absolute; inset: 0; opacity: 0; }
  .mono, .code, .term { font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; }

  /* כותרת עליונה */
  .hdr { position: absolute; top: 34px; left: 24px; right: 24px; }
  .hdr .kick { font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #7b83b5; }
  .hdr .kick b { display: inline-block; background: #5b6cff; color: #fff; border-radius: 10px;
                 padding: 2px 9px; margin-right: 8px; letter-spacing: 1px; }
  .hdr h1 { font-size: 36px; font-weight: 800; color: #1f2a44; margin-top: 6px; line-height: 1.1; }

  .stack { position: absolute; top: 150px; left: 24px; right: 24px;
           display: flex; flex-direction: column; gap: 14px; }

  /* עורך קוד */
  .editor { background: #1d2033; border-radius: 22px; overflow: hidden;
            box-shadow: 0 16px 34px rgba(31, 42, 68, .25); }
  .editor .bar { height: 36px; background: #262a41; display: flex; align-items: center; padding: 0 16px; gap: 7px; }
  .editor .bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .editor .bar span { margin-left: 10px; color: #8f96bd; font-size: 14px; font-weight: 600; }
  .code { color: #e6e9f5; font-size: 18px; line-height: 1.6; padding: 14px 16px 16px;
          white-space: pre; position: relative; }
  .code .ln { display: block; border-radius: 8px; padding: 0 6px; margin: 0 -6px; }
  .code .ln.hl { background: rgba(91, 108, 255, .28); }
  .tk-kw { color: #ff8fd0; } .tk-str { color: #a6e3a1; } .tk-num { color: #fab387; }
  .tk-bi { color: #89b4fa; } .tk-fn { color: #f9e2af; } .tk-com { color: #7f88b0; }
  .tk-bool { color: #fab387; font-weight: 700; } .tk-op { color: #94e2d5; }
  .cur { display: inline-block; width: 10px; height: 22px; background: #ffd166;
         vertical-align: -4px; margin-left: 1px; border-radius: 2px; }
  .ind { background: rgba(255, 209, 102, var(--g, 0)); border-radius: 5px;
         box-shadow: 0 0 0 2px rgba(255, 209, 102, calc(var(--g, 0) * 1.4)); }

  /* מסוף פלט */
  .term { background: #0f1222; border-radius: 18px; padding: 10px 16px 12px; color: #c8f7c5;
          font-size: 18px; line-height: 1.55; box-shadow: 0 12px 26px rgba(31, 42, 68, .2); }
  .term .tl { font-family: "Rubik", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px;
              color: #6c7499; margin-bottom: 2px; }
  .term .row { white-space: pre; }
  .term .row::before { content: "› "; color: #5b6cff; }

  .card { background: #fff; border-radius: 22px; box-shadow: 0 12px 28px rgba(31, 42, 68, .13); }
  .chip { display: inline-block; border-radius: 14px; padding: 6px 12px; font-weight: 700; }
  .center { text-align: center; }
</style>
</head>
<body>
<div id="root"></div>

<script src="../../factory/frame.js"></script>
<script>
const { clamp, lerp, ease, span, $ } = H;

/* ---------- צביעת תחביר ---------- */
const KW = new Set(["def", "return", "if", "else", "elif", "for", "in", "import", "while", "and", "or", "not", "from"]);
const BI = new Set(["print", "len", "range", "input"]);
function tokenize(line) {
  const out = [];
  const re = /(#.*$)|("[^"]*"?|'[^']*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|([=+\-*/<>!]=?|[()\[\]{}.,:])/g;
  let m;
  while ((m = re.exec(line))) {
    let c = "";
    if (m[1]) c = "com";
    else if (m[2]) c = "str";
    else if (m[3]) c = "num";
    else if (m[4]) {
      const w = m[4];
      if (w === "True" || w === "False" || w === "None") c = "bool";
      else if (KW.has(w)) c = "kw";
      else if (BI.has(w)) c = "bi";
      else if (line[re.lastIndex] === "(") c = "fn";
    } else if (m[6]) c = "op";
    out.push({ s: m[0], c });
  }
  return out;
}
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// מצייר שורת קוד עד n תווים
function lineHTML(tokens, n, glow) {
  let html = "", left = n, first = true;
  for (const tk of tokens) {
    if (left <= 0) break;
    const s = tk.s.slice(0, left);
    left -= s.length;
    if (first && /^\s+$/.test(tk.s) && glow > 0) html += `<span class="ind" style="--g:${(glow * 0.45).toFixed(3)}">${s}</span>`;
    else html += tk.c ? `<span class="tk-${tk.c}">${esc(s)}</span>` : esc(s);
    first = false;
  }
  return html;
}

function editorHTML(file, id) {
  return `<div class="editor"><div class="bar"><i style="background:#ff6b6b"></i><i style="background:#ffd166"></i><i style="background:#2fbf71"></i><span>${file}</span></div><div class="code" id="${id}"></div></div>`;
}
function termHTML(id, rows) {
  return `<div class="term"><div class="tl">OUTPUT</div><div id="${id}" style="min-height:${rows * 28}px"></div></div>`;
}

/* ---------- תזמון לפי הקריינות ---------- */
// זמן (שניות מוחלטות) שבו המשפט נאמר — הערכה לפי מיקום המילים בטקסט
function at(sc, phrase) {
  if (typeof phrase === "number") return sc.speechStart + phrase;
  const i = sc.say.indexOf(phrase);
  const k = i < 0 ? 0 : i / sc.say.length;
  return sc.speechStart + k * (sc.speechEnd - sc.speechStart);
}

// הקלדת קוד: כל שורה מתחילה בזמן שלה (או אחרי הקודמת)
function drawCode(el, sc, t, lines, opt = {}) {
  const cps = opt.cps || 26;
  if (!lines._tk) lines._tk = lines.map((l) => tokenize(l.text));
  let prevEnd = -1e9, html = "", curDone = false;
  const typed = [];
  lines.forEach((l, i) => {
    const st = Math.max(l.at === undefined ? prevEnd : at(sc, l.at), prevEnd);
    const n = clamp(Math.floor((t - st) * cps), 0, l.text.length);
    prevEnd = st + l.text.length / cps + 0.12;
    typed.push(n);
  });
  // השורה האחרונה שהתחילה להיות מוקלדת
  let last = -1;
  typed.forEach((n, i) => { if (n > 0 || (lines[i].text === "" && i > 0 && typed[i - 1] === lines[i - 1].text.length)) last = i; });
  lines.forEach((l, i) => {
    const glow = opt.glow ? opt.glow(i) : 0;
    let inner = lineHTML(lines._tk[i], typed[i], glow);
    if (i === last && !opt.noCursor && Math.floor(t * 2.2) % 2 === 0) inner += `<span class="cur"></span>`;
    const hl = opt.hl !== undefined && opt.hl === i ? " hl" : "";
    html += `<span class="ln${hl}">${inner || " "}</span>`;
  });
  el.innerHTML = html;
}

function drawTerm(el, sc, t, rows) {
  let html = "";
  for (const r of rows) {
    const st = typeof r.t === "number" && r.abs ? r.t : at(sc, r.at);
    if (t >= st) html += `<div class="row" style="opacity:${clamp((t - st) / 0.25)}">${esc(r.text)}</div>`;
  }
  el.innerHTML = html;
}

const ap = (sc, t, phrase, d = 0.5) => ease(clamp((t - at(sc, phrase)) / d));
const pop = (el, k, dy = 18) => {
  el.style.opacity = k;
  el.style.transform = `translateY(${(1 - k) * dy}px) scale(${0.94 + 0.06 * k})`;
};

function header(n, title) {
  return `<div class="hdr"><div class="kick"><b>${n}</b>PYTHON BASICS</div><h1>${title}</h1></div>`;
}

/* ---------- נחש מצויר (עיצוב מקורי) ---------- */
function snakePath(t, x0, x1, y, amp, wl) {
  let d = "";
  for (let x = x0; x <= x1; x += 6) {
    const yy = y + amp * Math.sin((x - x0) / wl - t * 2.4) * (0.35 + 0.65 * (x - x0) / (x1 - x0));
    d += (d ? " L" : "M") + x.toFixed(1) + " " + yy.toFixed(1);
  }
  return d;
}
function drawSnake(id, t, x0, x1, y, amp, wl, scale) {
  const g = $(id);
  const yh = y + amp * Math.sin((x1 - x0) / wl - t * 2.4);
  const slope = amp * Math.cos((x1 - x0) / wl - t * 2.4) / wl;
  const ang = Math.atan(slope) * 180 / Math.PI;
  g.querySelector(".body").setAttribute("d", snakePath(t, x0, x1, y, amp, wl));
  g.querySelector(".dots").setAttribute("d", snakePath(t, x0, x1, y, amp, wl));
  const head = g.querySelector(".head");
  head.setAttribute("transform", `translate(${x1} ${yh}) rotate(${ang}) scale(${scale})`);
  const flick = (t % 2.6) < 0.5 ? Math.sin((t % 2.6) / 0.5 * Math.PI) : 0;
  g.querySelector(".tongue").setAttribute("transform", `scale(${0.2 + 0.8 * flick} 1)`);
  const blink = (t % 3.7) < 0.14 ? 0.15 : 1;
  g.querySelectorAll(".eye").forEach((e) => e.setAttribute("transform", `scale(1 ${blink})`));
}
function snakeSVG(id, w, h, sw) {
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible"><g id="${id}">
    <path class="body" fill="none" stroke="url(#snk)" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="dots" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="${sw * 0.18}" stroke-linecap="round" stroke-dasharray="0 ${sw * 0.9}"/>
    <g class="head">
      <g class="tongue"><path d="M28 0 L56 0 L64 -7 M56 0 L64 7" stroke="#ff6b6b" stroke-width="4" fill="none" stroke-linecap="round"/></g>
      <ellipse cx="6" cy="0" rx="34" ry="27" fill="#27a862"/>
      <ellipse cx="2" cy="-4" rx="30" ry="20" fill="#3fcf7f"/>
      <g transform="translate(8 -13)"><circle r="9" fill="#fff"/><g class="eye"><circle cx="2" cy="0" r="5" fill="#1f2a44"/></g></g>
      <g transform="translate(8 13)"><circle r="9" fill="#fff"/><g class="eye"><circle cx="2" cy="0" r="5" fill="#1f2a44"/></g></g>
      <ellipse cx="-6" cy="-12" rx="6" ry="3" fill="#ff9aa2" opacity=".0"/>
    </g></g></svg>`;
}

/* ---------- אייקונים קטנים ---------- */
const ICON = {
  camera: `<rect x="6" y="12" width="36" height="28" rx="9" fill="none" stroke="#fff" stroke-width="4"/><circle cx="24" cy="26" r="7" fill="none" stroke="#fff" stroke-width="4"/><circle cx="35" cy="18" r="2.4" fill="#fff"/>`,
  play: `<rect x="6" y="10" width="36" height="28" rx="9" fill="none" stroke="#fff" stroke-width="4"/><path d="M20 17 L31 24 L20 31 Z" fill="#fff"/>`,
  music: `<path d="M18 34 V12 L36 8 V30" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><circle cx="14" cy="35" r="5" fill="#fff"/><circle cx="32" cy="31" r="5" fill="#fff"/>`,
  chart: `<rect x="8" y="26" width="7" height="14" rx="3" fill="#fff"/><rect x="20" y="16" width="7" height="24" rx="3" fill="#fff"/><rect x="32" y="8" width="7" height="32" rx="3" fill="#fff"/>`,
  ai: `<path d="M24 4 C26 16 30 20 42 22 C30 24 26 28 24 40 C22 28 18 24 6 22 C18 20 22 16 24 4 Z" fill="#fff"/><circle cx="38" cy="8" r="3" fill="#fff"/>`,
  more: `<circle cx="12" cy="24" r="4.5" fill="#fff"/><circle cx="24" cy="24" r="4.5" fill="#fff"/><circle cx="36" cy="24" r="4.5" fill="#fff"/>`,
};
const icon = (k, s = 48) => `<svg width="${s}" height="${s}" viewBox="0 0 48 48">${ICON[k]}</svg>`;

/* ---------- סצנות ---------- */
const S = {};

S.intro = {
  html: `
    <svg width="0" height="0" style="position:absolute"><defs>
      <linearGradient id="snk" x1="0" x2="1"><stop offset="0" stop-color="#7be3a8"/><stop offset="1" stop-color="#27a862"/></linearGradient>
    </defs></svg>
    <div id="introBlob" style="position:absolute;left:70px;top:190px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#dfe4ff 0%,rgba(223,228,255,0) 70%)"></div>
    <div style="position:absolute;left:30px;top:250px">${snakeSVG("snakeA", 480, 300, 44)}</div>
    <div id="iTitle" class="center" style="position:absolute;top:600px;left:0;right:0">
      <div style="font-size:50px;font-weight:900;color:#1f2a44;line-height:1">What is <span style="color:#2fa866">Python</span>?</div>
      <div id="iBar" style="height:8px;width:140px;margin:18px auto 0;border-radius:4px;background:#ffd166"></div>
      <div id="iSub" style="font-size:22px;font-weight:600;color:#5b6390;margin-top:16px">The basics, with real code</div>
    </div>
    ${["print()", "for", "def", "[ ]", "if", "import"].map((c, i) => `<div class="chip mono fl" style="position:absolute;background:#fff;color:#5b6cff;box-shadow:0 8px 20px rgba(31,42,68,.12);font-size:18px">${c}</div>`).join("")}
  `,
  draw(sc, t, local) {
    drawSnake("snakeA", t, 40, 400, 150, 46, 62, 1.15);
    const k = ease(clamp(local / 0.9));
    pop($("iTitle"), k, 30);
    $("iBar").style.width = 140 * ease(span(local, 0.5, 1.5)) + "px";
    $("iSub").style.opacity = ease(span(local, 0.9, 1.7));
    const pos = [[40, 160], [380, 150], [430, 470], [30, 500], [250, 120], [210, 540]];
    document.querySelectorAll(".fl").forEach((el, i) => {
      const kk = ease(span(local, 0.3 + i * 0.25, 0.9 + i * 0.25));
      const [x, y] = pos[i];
      el.style.left = x + "px";
      el.style.top = y + 8 * Math.sin(t * 1.6 + i * 1.3) + "px";
      el.style.opacity = kk;
      el.style.transform = `scale(${0.6 + 0.4 * kk}) rotate(${(i % 2 ? 1 : -1) * 6}deg)`;
    });
  },
};

S.what = {
  html: `${header("1", "What is it?")}
    <div class="stack" style="gap:18px;top:170px">
      <div class="card" id="w1" style="display:flex;gap:18px;align-items:center;padding:22px">
        <div style="width:92px;height:92px;border-radius:24px;background:#5b6cff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800" class="mono">&lt;/&gt;</div>
        <div><div style="font-size:26px;font-weight:800">A programming language</div><div style="font-size:19px;color:#5b6390;margin-top:4px">Instructions for a computer, written in words</div></div>
      </div>
      <div class="card" id="w2" style="display:flex;gap:18px;align-items:center;padding:22px">
        <div style="width:92px;height:92px;border-radius:24px;background:#ffb020;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900">1991</div>
        <div><div style="font-size:26px;font-weight:800">Guido van Rossum</div><div style="font-size:19px;color:#5b6390;margin-top:4px">Created it, released in 1991</div></div>
      </div>
      <div class="card" id="w3" style="display:flex;gap:18px;align-items:center;padding:22px">
        <div style="width:92px;height:92px;border-radius:24px;background:#ff6b6b;position:relative;display:flex;align-items:center;justify-content:center">
          <svg width="70" height="70" viewBox="0 0 70 70"><rect x="6" y="14" width="58" height="40" rx="10" fill="none" stroke="#fff" stroke-width="5"/><path d="M24 62 h22" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M26 26 c4 6 14 6 18 0 M26 40 c6 6 12 6 18 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
        </div>
        <div><div style="font-size:26px;font-weight:800">Named after a comedy</div><div style="font-size:19px;color:#5b6390;margin-top:4px">Monty Python, a British TV show</div></div>
      </div>
      <div id="w4" style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px">
        <svg width="120" height="70" viewBox="0 0 120 70" style="overflow:visible"><path d="M10 40 C30 10 50 70 70 40 S100 20 104 34" stroke="#3fcf7f" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="106" cy="34" r="12" fill="#27a862"/>
          <path id="wX" d="M20 8 L100 64 M100 8 L20 64" stroke="#ff4d4d" stroke-width="9" stroke-linecap="round"/></svg>
        <div style="font-size:24px;font-weight:800;color:#ff4d4d">Not the snake!</div>
      </div>
    </div>`,
  draw(sc, t) {
    pop($("w1"), ap(sc, t, "a way to give", 0.6));
    pop($("w2"), ap(sc, t, "It was created", 0.6));
    pop($("w3"), ap(sc, t, "It comes from Monty", 0.6));
    pop($("w4"), ap(sc, t, "It doesn't come", 0.6));
    const x = ap(sc, t, "from the snake", 0.5);
    $("wX").setAttribute("stroke-dasharray", "200");
    $("wX").setAttribute("stroke-dashoffset", 200 * (1 - x));
  },
};

S.where = {
  html: `${header("2", "Where is it used?")}
    <div class="stack" style="top:170px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        ${[["Instagram", "camera", "#e1306c"], ["Netflix", "play", "#e50914"], ["Spotify", "music", "#1db954"],
           ["Science & data", "chart", "#5b6cff"], ["AI tools", "ai", "#9b5cff"], ["Much more", "more", "#ffb020"]]
          .map(([n, ic, c], i) => `<div class="card wt" style="padding:20px;height:150px;display:flex;flex-direction:column;justify-content:space-between">
              <div style="width:64px;height:64px;border-radius:20px;background:${c};display:flex;align-items:center;justify-content:center">${icon(ic, 46)}</div>
              <div style="font-size:23px;font-weight:800">${n}</div></div>`).join("")}
      </div>
    </div>`,
  draw(sc, t) {
    const cues = ["Instagram", "Netflix", "Spotify", "Scientists", "almost every", "built with"];
    document.querySelectorAll(".wt").forEach((el, i) => pop(el, ap(sc, t, cues[i], 0.5)));
  },
};

S.hello = {
  lines: [{ text: 'print("Hello, world!")', at: "Just one line" }],
  html: `${header("3", "Your first program")}
    <div class="stack">
      ${editorHTML("hello.py", "hCode")}
      ${termHTML("hTerm", 1)}
      <div class="card" id="hCmp" style="padding:20px 22px;margin-top:6px">
        <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:20px;font-weight:800;color:#2fa866">Python</div><div style="font-size:16px;color:#5b6390;font-weight:700">1 line</div></div>
        <div style="height:14px;width:62%;background:#2fbf71;border-radius:7px;margin:10px 0 18px"></div>
        <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:20px;font-weight:800;color:#8a90b2">Many other languages</div><div style="font-size:16px;color:#5b6390;font-weight:700">5–10 lines</div></div>
        <div id="hBars" style="margin-top:10px"></div>
      </div>
    </div>`,
  draw(sc, t) {
    drawCode($("hCode"), sc, t, this.lines, { cps: 18 });
    drawTerm($("hTerm"), sc, t, [{ text: "Hello, world!", at: "Hello, world" }]);
    const k = ap(sc, t, "In many other", 0.5);
    pop($("hCmp"), k);
    const w = [40, 70, 55, 82, 34, 60, 26];
    let h = "";
    w.forEach((x, i) => {
      const kk = ease(clamp((t - at(sc, "In many other") - 0.3 - i * 0.18) / 0.3));
      h += `<div style="height:9px;width:${x * kk}%;background:#c9cee6;border-radius:5px;margin-bottom:6px"></div>`;
    });
    $("hBars").innerHTML = h;
  },
};

function boxSVG(label, color) {
  return `<div style="text-align:center">
    <div class="vb" style="position:relative;width:180px;height:150px;margin:0 auto">
      <svg width="180" height="150" viewBox="0 0 180 150" style="position:absolute;left:0;top:0">
        <path d="M20 50 L160 50 L160 136 C160 142 156 146 150 146 L30 146 C24 146 20 142 20 136 Z" fill="${color}"/>
        <path d="M20 50 L44 26 L136 26 L160 50 Z" fill="${color}" opacity=".7"/>
        <rect x="50" y="92" width="80" height="32" rx="10" fill="#fff"/>
        <text x="90" y="115" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2a44" font-family="DejaVu Sans Mono, monospace">${label}</text>
      </svg>
      <div class="val mono" style="position:absolute;left:0;right:0;font-size:24px;font-weight:700;color:#1f2a44"></div>
    </div></div>`;
}

S.vars = {
  lines: [
    { text: 'name = "Ori"', at: "Here, the box" },
    { text: "age = 30", at: "and the box called age" },
    { text: "print(name, age)", at: "Later" },
  ],
  html: `${header("4", "Variables")}
    <div class="stack">
      ${editorHTML("variables.py", "vCode")}
      ${termHTML("vTerm", 1)}
      <div style="display:flex;justify-content:space-around;margin-top:20px" id="vBoxes">
        ${boxSVG("name", "#5b6cff")}${boxSVG("age", "#ffb020")}
      </div>
    </div>`,
  draw(sc, t) {
    drawCode($("vCode"), sc, t, this.lines);
    drawTerm($("vTerm"), sc, t, [{ text: "Ori 30", at: "use the box" }]);
    pop($("vBoxes"), ap(sc, t, "labeled box", 0.6));
    const vals = ['"Ori"', "30"], cues = ["holds the text", "holds the number"];
    document.querySelectorAll("#vBoxes .val").forEach((el, i) => {

function gear(r, n) {
  let d = "";
  for (let i = 0; i < n * 2; i++) {
    const a0 = (i / (n * 2)) * Math.PI * 2, a1 = ((i + 1) / (n * 2)) * Math.PI * 2;
    const R = i % 2 ? r * 0.78 : r;
    d += (i ? "L" : "M") + (R * Math.cos(a0)).toFixed(1) + " " + (R * Math.sin(a0)).toFixed(1) + " L" + (R * Math.cos(a1)).toFixed(1) + " " + (R * Math.sin(a1)).toFixed(1) + " ";
  }
  return d + "Z";
}

    el.style.opacity = k;
    el.style.transform = `translateX(${(1 - k) * 40}px)`;
    S[id].draw(sc, t, local);
  }
};
</script>
