<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>חיבור טיעון בפסיכומטרי</title>
<link rel="stylesheet" href="../../factory/frame.css">
<style>
  :root {
    --ink: #1f2a44; --soft: #5b6782; --paper: #fbf7ef;
    --blue: #4c6ef5; --green: #2fb36d; --red: #ef5560; --orange: #ff9f43; --purple: #845ef7; --teal: #12b3a8;
  }
  body { background: var(--paper); }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #prog { position: absolute; top: 26px; left: 28px; right: 28px; height: 6px; display: flex; gap: 5px; direction: rtl; z-index: 5; }
  #prog i { flex: 1; border-radius: 3px; background: #e3dccd; position: relative; overflow: hidden; }
  #prog i b { position: absolute; top: 0; bottom: 0; right: 0; background: var(--ink); border-radius: 3px; }

  .scene { position: absolute; inset: 0; opacity: 0; }
  .hdr { position: absolute; top: 58px; right: 28px; left: 28px; display: flex; align-items: center; gap: 12px; }
  .num { min-width: 46px; height: 46px; border-radius: 16px; color: #fff; font-weight: 800; font-size: 22px;
         display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(31,42,68,.18); }
  .ttl { font-size: 36px; font-weight: 800; letter-spacing: -0.3px; }
  .uline { position: absolute; top: 116px; right: 86px; height: 7px; border-radius: 4px; transform-origin: right center; }
  .body { position: absolute; top: 160px; right: 28px; left: 28px; height: 610px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }

  .card { background: #fff; border-radius: 22px; padding: 16px 20px; box-shadow: 0 10px 26px rgba(31,42,68,.10); }
  .row { display: flex; align-items: center; gap: 14px; }
  .big { font-size: 29px; font-weight: 700; line-height: 1.3; }
  .med { font-size: 24px; font-weight: 600; line-height: 1.35; }
  .sm { font-size: 19px; font-weight: 500; color: var(--soft); line-height: 1.35; }
  .ico { flex: 0 0 auto; width: 44px; height: 44px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; font-size: 22px; font-weight: 700; background: #fff; box-shadow: 0 6px 16px rgba(31,42,68,.10); }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
</style>
<script src="../../factory/frame.js"></script>
</head>
<body>
<svg id="bg" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
  <g id="lines" stroke="#c9dcf3" stroke-width="1.4"></g>
  <line x1="496" y1="0" x2="496" y2="960" stroke="#f3b2b2" stroke-width="2"/>
  <circle cx="-30" cy="980" r="190" fill="#ffe8c2" opacity=".55"/>
  <circle cx="560" cy="-20" r="120" fill="#dfe7ff" opacity=".6"/>
</svg>
<div id="prog"></div>
<div id="root"></div>

<script>
const { clamp, lerp, ease, span, $ } = H;
const NS = "http://www.w3.org/2000/svg";

// ---------- אייקונים ----------
const ICON = {

  x: (c = "var(--red)") => `<svg class="ico" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="${c}"/><path d="M14 14 L30 30 M30 14 L14 30" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>`,

      <g stroke="#1f2a44" stroke-width="7" stroke-linecap="round" opacity=".55">
        <line x1="410" y1="40" x2="80" y2="40"/><line x1="410" y1="70" x2="110" y2="70"/><line x1="410" y1="100" x2="74" y2="100"/><line x1="410" y1="130" x2="140" y2="130"/><line x1="410" y1="158" x2="220" y2="158"/></g>
      <g id="fixes" stroke="var(--red)" stroke-width="4" fill="none" stroke-linecap="round"></g>
      <g id="mag"><circle r="30" fill="#dfe7ff" fill-opacity=".45" stroke="var(--blue)" stroke-width="7"/><line x1="21" y1="21" x2="46" y2="46" stroke="var(--blue)" stroke-width="10" stroke-linecap="round"/></g>
    </svg>
    <div class="card row" data-at="כתיב">${ICON.check("var(--blue)")}<div class="big">כתיב ופיסוק</div></div>
    <div class="card row" data-at="זכר">${ICON.check("var(--blue)")}<div class="big">זכר ונקבה</div></div>
    <div class="card row" data-at="ויחיד">${ICON.check("var(--blue)")}<div class="big">יחיד ורבים</div></div>
    <div class="card row" data-at="ותקנו">${ICON.check("var(--blue)")}<div class="big">תיקונים ברורים ונקיים</div></div>
  `},

  outro: { title: "לסיכום", color: "var(--green)", html: `
    <div class="card row" data-at="תכננו">${ICON.n(1, "var(--blue)")}<div class="big">תכננו</div></div>
    <div class="card row" data-at="נקטו">${ICON.n(2, "var(--purple)")}<div class="big">נקטו עמדה</div></div>
    <div class="card row" data-at="נמקו">${ICON.n(3, "var(--teal)")}<div class="big">נמקו עם דוגמאות</div></div>
    <div class="card row" data-at="התייחסו">${ICON.n(4, "var(--orange)")}<div class="big">התייחסו לצד השני</div></div>
    <div class="card row" data-at="וכתבו">${ICON.n(5, "var(--green)")}<div class="big">כתבו בשפה גבוהה</div></div>
    <div data-at="בהצלחה" style="text-align:center;font-size:48px;font-weight:900;color:var(--green);margin-top:4px">בהצלחה במבחן!</div>
  `},
};
const ORDER = Object.keys(SC);
const CONNECTORS = ["ראשית", "שנית", "יתרה מזאת", "לעומת זאת", "אולם", "לפיכך", "ולסיכום"];
const CONN_COLORS = ["#4c6ef5", "#4c6ef5", "#2fb36d", "#ef5560", "#ef5560", "#845ef7", "#ff9f43"];

const nodes = {};
const introLines = [];
const fixes = [];

window.init = function () {
  // רקע מחברת
  for (let y = 40; y < 960; y += 34) {
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 0); l.setAttribute("x2", 540); l.setAttribute("y1", y); l.setAttribute("y2", y);
    $("lines").appendChild(l);
  }
  // פס התקדמות
  ORDER.forEach(() => { const i = document.createElement("i"); i.appendChild(document.createElement("b")); $("prog").appendChild(i); });

  ORDER.forEach((id, k) => {
    const d = SC[id];
    const el = document.createElement("div");
    el.className = "scene"; el.id = "sc-" + id;
    let hdr = "";
    if (!d.noHdr) {
      hdr = `<div class="hdr"><div class="num" style="background:${d.color}">${k}</div><div class="ttl">${d.title}</div></div>
             <div class="uline" style="background:${d.color};width:150px"></div>`;
    }
    el.innerHTML = hdr + (d.noHdr ? d.html : `<div class="body">${d.html}</div>`);
    $("root").appendChild(el);
    nodes[id] = { el, items: [...el.querySelectorAll("[data-at]")], grows: [...el.querySelectorAll("[data-grow]")],
                  uline: el.querySelector(".uline"), ttl: el.querySelector(".hdr") };
  });

  // מילות קישור: שרשרת שורות
  const conn = $("conn");
  for (let r = 0; r < 4; r++) {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:10px;justify-content:center";
    conn.appendChild(row);
  }
  const rowsOf = [[0, 1], [2, 3], [4, 5], [6]];
  rowsOf.forEach((idxs, r) => idxs.forEach((i) => {
    const c = document.createElement("span");
    c.className = "chip"; c.dataset.at = CONNECTORS[i];
    c.style.cssText = `font-size:26px;padding:12px 24px;color:#fff;background:${CONN_COLORS[i]}`;
    c.textContent = CONNECTORS[i] === "ולסיכום" ? "לסיכום" : CONNECTORS[i];
    conn.children[r].appendChild(c);
  }));
  nodes.connectors.items = [...nodes.connectors.el.querySelectorAll("[data-at]")];

  // דף כתיבה בפתיחה
  for (let i = 0; i < 9; i++) {
    const l = document.createElementNS(NS, "line");
    const y = 82 + i * 28, x0 = 276, x1 = i === 8 ? 150 : (i % 3 === 2 ? 96 : 52);
    l.setAttribute("x1", x0); l.setAttribute("y1", y); l.setAttribute("x2", x0); l.setAttribute("y2", y);
    $("iLines").appendChild(l);
    introLines.push({ l, y, x0, x1 });
  }
  // סימוני תיקון בבדיקה
  [[300, 40], [180, 100], [260, 130]].forEach(([x, y]) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M${x - 22} ${y + 10} q11 10 22 0 t22 0`);
    $("fixes").appendChild(p); fixes.push(p);
  });
};

// מתי הקריין מגיע למילה
function whenSaid(sc, key) {
  if (key === "^") return sc.start + 0.25;
  const say = sc.say || "";
  const i = say.indexOf(key);
  if (i < 0) return sc.start + 0.3;
  const frac = i / Math.max(1, say.length);
  return sc.speechStart + frac * (sc.speechEnd - sc.speechStart) - 0.15;
}

window.drawScene = function (sc, p, t, info, local) {
  const k = ORDER.indexOf(sc.id);
  // פס התקדמות
  [...$("prog").children].forEach((c, i) => {
    c.firstChild.style.width = (i < k ? 100 : i === k ? 100 * p : 0) + "%";
  });

  for (const id of ORDER) {
    const n = nodes[id];
    if (id !== sc.id) { n.el.style.opacity = 0; continue; }
    const dur = sc.end - sc.start;
    const fade = Math.min(clamp(local / 0.35), clamp((dur - local) / 0.3));
    n.el.style.opacity = fade;

    if (n.ttl) {
      const a = ease(clamp(local / 0.5));
      n.ttl.style.transform = `translateX(${(1 - a) * -30}px)`;
      n.ttl.style.opacity = a;
      n.uline.style.transform = `scaleX(${ease(span(local, 0.2, 0.9))})`;
    }
    for (const it of n.items) {
      const v = ease(clamp((t - whenSaid(sc, it.dataset.at)) / 0.45));
      it.style.opacity = v;
      const base = it.style.transform.includes("translateX(-50%)") ? "translateX(-50%) " : (it.style.transform.includes("rotate") ? "rotate(-1.5deg) " : "");
      it.style.transform = `${base}translateY(${(1 - v) * 18}px) scale(${0.96 + 0.04 * v})`;
    }
    for (const g of n.grows) {
      const v = ease(clamp((t - whenSaid(sc, g.dataset.grow)) / 0.9));
      g.style.transformOrigin = "right center";
      g.style.transform = `scaleX(${v})`;
    }
  }

  // ---- אנימציות מיוחדות ----
  if (sc.id === "intro") {
    const per = 0.75;
    introLines.forEach((L, i) => {
      const v = clamp((local - 0.8 - i * per) / per);
      const x = lerp(L.x0, L.x1, v);
      L.l.setAttribute("x2", x);
      L.l.setAttribute("opacity", v > 0 ? 1 : 0);
    });
    const cur = clamp(Math.floor((local - 0.8) / per), 0, introLines.length - 1);
    const L = introLines[cur];
    const v = clamp((local - 0.8 - cur * per) / per);
    const px = lerp(L.x0, L.x1, v), py = L.y - 2 + Math.sin(local * 30) * 1.5;
    $("pencil").setAttribute("transform", `translate(${px} ${py})`);
  }
  if (sc.id === "task") {
    const a = ((t - whenSaid(sc, "שלושים")) * 0.9) % 1;
    const ang = clamp(a) * Math.PI * 2;
    $("clockHand").setAttribute("x2", 40 + 26 * Math.sin(ang));
    $("clockHand").setAttribute("y2", 40 - 26 * Math.cos(ang));
    const large = ang > Math.PI ? 1 : 0;
    $("clockSweep").setAttribute("d", ang <= 0.01 ? "" : `M40 40 L40 9 A31 31 0 ${large} 1 ${40 + 31 * Math.sin(ang)} ${40 - 31 * Math.cos(ang)} Z`);
  }
  if (sc.id === "counter") {
    const v = ease(clamp((t - whenSaid(sc, "עדיפה")) / 1.0));
    const wob = 2.5 * Math.sin(local * 2.2) * (1 - v);
    const ang = (lerp(0, 9, v) + wob) * Math.PI / 180;  // צד ימין (העמדה שלי) יורד
    const cx = 242, cy = 70, r = 170;
    $("beam").setAttribute("transform", `rotate(${ang * 180 / Math.PI} ${cx} ${cy})`);
    $("panR").setAttribute("transform", `translate(${cx + r * Math.cos(ang)} ${cy + r * Math.sin(ang)})`);
    $("panL").setAttribute("transform", `translate(${cx - r * Math.cos(ang)} ${cy - r * Math.sin(ang)})`);
  }
  if (sc.id === "register") {
    const v = ease(clamp((t - whenSaid(sc, "כתבו: מדובר") + 0.6) / 0.5));
    const s = $("strike"); s.style.width = "calc(100% + 8px)"; s.style.transform = `scaleX(${v})`;
  }
  if (sc.id === "connectors") {
    // תנועה קלה של הצ'יפים
    nodes.connectors.el.querySelectorAll("#conn .chip").forEach((c, i) => {
      if (+c.style.opacity < 1) return;
      c.style.transform = `translateY(${Math.sin(t * 2 + i) * 2.5}px)`;
    });
  }
  if (sc.id === "review") {
    const pts = [[380, 40], [300, 40], [180, 100], [110, 100], [260, 130], [200, 130], [360, 158]];
    const q = clamp(local / Math.max(1, sc.speechEnd - sc.start)) * (pts.length - 1);
    const i = Math.min(pts.length - 2, Math.floor(q)), f = ease(q - i);
    const x = lerp(pts[i][0], pts[i + 1][0], f), y = lerp(pts[i][1], pts[i + 1][1], f);
    $("mag").setAttribute("transform", `translate(${x} ${y})`);
    fixes.forEach((fx, j) => fx.setAttribute("opacity", q > [1, 3, 5][j] ? 1 : 0));
  }
};
</script>
</body>
</html>
